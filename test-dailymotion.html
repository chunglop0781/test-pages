
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dailymotion HLS Player</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        video {
            display: block;
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            background: black;
        }

        #status {
            text-align: center;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h2>Dailymotion Player</h2>

    <video id="video" controls playsinline></video>
    <p id="status">Đang chờ nguồn video...</p>

    <script>
        const video = document.getElementById("video");
        const status = document.getElementById("status");

        // Dán URL HLS được phép nhúng tại đây.
        const HLS_URL = "";

        function playHLS(url) {
            if (!url) {
                status.textContent = "Chưa có URL HLS.";
                return;
            }

            if (Hls.isSupported()) {
                const hls = new Hls();

                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    status.textContent = "Video đã sẵn sàng.";
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        status.textContent =
                            "Không thể phát: " + data.details;
                        hls.destroy();
                    }
                });
            } else if (video.canPlayType(
                "application/vnd.apple.mpegurl"
            )) {
                video.src = url;
            } else {
                status.textContent =
                    "Trình duyệt không hỗ trợ HLS.";
            }
        }

        playHLS(HLS_URL);
    </script>

</body>
</html>
