
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dailymotion HLS Player</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        video {
            display: block;
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            background: black;
        }

        #status {
            text-align: center;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h2>Dailymotion Player</h2>

    <video id="video" controls playsinline></video>
    <p id="status">Đang chờ nguồn video...</p>

    <script>
        const video = document.getElementById("video");
        const status = document.getElementById("status");

        // Dán URL HLS được phép nhúng tại đây.
        const HLS_URL = "https://dmxleo.dailymotion.com/cdn/manifest/video/k7amVyU7B8K92VM9DTQ.m3u8?ps=648x365&ct=website&td=www.dailymotion.com&eb=https%3A%2F%2Fwww.dailymotion.com%2Fvideo%2Fk7amVyU7B8K92VM9DTQ&reader_gdpr_flag=0&reader_gdpr_consent=&gdpr_binary_consent=opt-out&gdpr_comes_from_infopack=0&reader_us_privacy=1---&vl=10&rap=1&vidIdx=0&omp=Dailymotion%2F1.0&imal=1&3pcb=0&cap=com.dailymotion.neon&rts=194399&rhv=1&cen=prod&cos=1&rla=vi&cpr=xtv3w&cse=1k6d7ndpq5ecf4a4ce9&pbm=1&pos=1&plcmt=1&aps=1&ciid=1k6d7ndpq5ecf4a4ce9_VMAP_0_0&cidx=0&rdm=9bafc2c6-9b9f-403f-9ebe-11c1b2fac719&pdm=regular&apo=standard&ccUserGesture=click&uid_dm=2339912d-97f2-0887-be31-3c17f04b3d95&af=2%2C7&vv=1%2C2%2C3%2C4%2C5%2C6%2C7%2C8%2C11%2C12%2C13%2C14&mm=video%2Fmp4%2Cvideo%2Fwebm%2Caudio%2Fmp4%2Caudio%2Fmpeg%2Caudio%2Faac%2Caudio%2Fmpeg3%2Caudio%2Fmp3%2Caudio%2Fvnd.wave%2Caudio%2Fwav%2Caudio%2Fwave%2Caudio%2Fogg%2Caudio%2Fvorbis";

        function playHLS(url) {
            if (!url) {
                status.textContent = "Chưa có URL HLS.";
                return;
            }

            if (Hls.isSupported()) {
                const hls = new Hls();

                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    status.textContent = "Video đã sẵn sàng.";
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        status.textContent =
                            "Không thể phát: " + data.details;
                        hls.destroy();
                    }
                });
            } else if (video.canPlayType(
                "application/vnd.apple.mpegurl"
            )) {
                video.src = url;
            } else {
                status.textContent =
                    "Trình duyệt không hỗ trợ HLS.";
            }
        }

        playHLS(HLS_URL);
    </script>

</body>
</html>
